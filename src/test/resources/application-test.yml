# Profil de test : H2 en mémoire en mode PostgreSQL, mêmes migrations Flyway qu'en production.
spring:
  datasource:
    url: jdbc:h2:mem:dolce;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none

app:
  jwt:
    secret: test-secret-only-for-unit-tests-0123456789abcdef
    expiration-minutes: 30
  admin:
    email: admin@test.dolcecandela.tn
    password: Admin-Test-Password-123
  storage:
    upload-dir: target/test-uploads
