spring:
  application:
    name: dolce-candela-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dolce_candela}
    username: ${DB_USERNAME:dolce}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none              # le schéma est géré uniquement par Flyway (jamais par Hibernate)
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    default-property-inclusion: non_null
  data:
    web:
      pageable:
        max-page-size: 50

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}

app:
  jwt:
    # Clé secrète d'au moins 32 caractères. OBLIGATOIRE : aucune valeur par défaut.
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    full-name: ${ADMIN_FULL_NAME:Administrateur Dolce Candela}
  business:
    delivery-fee: 8.000             # frais de livraison (DT)
    deposit-percent: 30             # acompte demandé sur les commandes personnalisées (%)
    pickup-location: "Centre-ville de Monastir"
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
  security:
    max-login-attempts: 5
    lockout-minutes: 15
